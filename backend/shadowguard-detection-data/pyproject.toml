[project]
name = "shadowguard-detection-data"
version = "0.1.0"
description = "Explainable, privacy-preserving detection signals for ShadowGuard AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ml = ["scikit-learn>=1.5,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shadowguard_detection"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
